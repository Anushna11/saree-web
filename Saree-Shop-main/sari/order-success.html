<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Placed - Shree Saree Center</title>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
    <link rel="stylesheet" href="style.css" />
  <style>
    
    body { font-family: Arial, sans-serif; background: #fffdf7; text-align: center; padding: 50px; }
    h2 { color: green; margin-top: 60px; }
    .details { margin-top: 20px; background: #fdf4f4; padding: 20px; border-radius: 8px; max-width: 600px; margin-left:auto; margin-right:auto; text-align: left; }
    .item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .item img { width: 60px; height: auto; border-radius: 5px; }
    .total { text-align: right; font-size: 18px; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>

    <nav class="navbar">
  <div class="logo" style="  color: white;
  text-decoration: none;
  font-weight: bold;
  transition: color 0.3s ease, transform 0.3s ease; /* smooth transition */
  font-size: 1.4rem;">Shree Saree Center</div>
  <div class="search-container">
    <input type="text" placeholder="Search sarees..." class="search-input">
    <button class="search-button"></button>
  </div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="saree.html">Sarees</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
   <li><a href="cart.html"><i class="fa fa-shopping-cart" aria-hidden="true"></i></a></li>
    <li><a href=""><i class="fa fa-user" aria-hidden="true"></i></a></li>
  </ul>
</nav>

<h2> Your Order has been Placed Successfully!</h2>
<p>Thank you for shopping with Shree Saree Center.</p>

<div class="details" id="orderDetails"></div>

<script>
  const order = JSON.parse(localStorage.getItem('orderData'));
  if(order){
    // Calculate total
    let total = 0;
    const itemsHTML = order.cart.map(item => {
      const itemTotal = item.price * item.qty;
      total += itemTotal;
      return `
        <div class="item">
          <img src="${item.image || 'images/default.jpg'}" alt="${item.name}">
          <div>
            <p><strong>${item.name}</strong></p>
            <p>₹${item.price} (QTY${item.qty}) = ₹${itemTotal}</p>
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('orderDetails').innerHTML = `
      <h3>Order Summary</h3>
      <p><strong>Name:</strong> ${order.name}</p>
      <p><strong>Mobile:</strong> ${order.mobile}</p>
      <p><strong>Address:</strong> ${order.address}</p>
      <p><strong>Payment Method:</strong> ${order.payment}</p>
      <h4>Items:</h4>
      ${itemsHTML}
      <p class="total">Total: ₹${total}</p>
    `;
    localStorage.removeItem('cart'); // Clear cart
  }
</script>

</body>
</html>
