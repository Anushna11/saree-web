// Price random generate करणार function
function randomPrice() {
  const price = Math.floor(Math.random() * (6000 - 1500) + 1500);
  const oldPrice = price + Math.floor(Math.random() * 2000 + 500);
  return { price, oldPrice };
}

// सर्व साड्या एकत्र करा, प्रत्येकाला price, oldPrice आणि color द्या
let allSarees = [];
const storedPrices = JSON.parse(localStorage.getItem('sareePrices')) || {};

for (const [type, items] of Object.entries(sareeData)) {
  allSarees = allSarees.concat(items.map(s => {
    const key = `${type}-${s.name}`;
    let prices;

    if (storedPrices[key]) {
      prices = storedPrices[key];  // आधीच store असेल तर तेच घ्या
    } else {
      prices = randomPrice();      // नसेल तर generate करा
      storedPrices[key] = prices;  // store करा
    }

    const colors = ["Red", "Blue", "Green"];
    const color = colors[Math.floor(Math.random() * colors.length)];
    return { ...s, type, color, price: prices.price, oldPrice: prices.oldPrice };
  }));
}

// नवीन rates store करा
localStorage.setItem('sareePrices', JSON.stringify(storedPrices));


  // URL मधून type आणि name parameter घ्या
 const params = new URLSearchParams(window.location.search);
const type = (params.get("type") || "").trim().toLowerCase();
const name = (params.get("name") || "").trim().toLowerCase();

const saree = allSarees.find(
  s => s.type.toLowerCase() === type && s.name.trim().toLowerCase() === name
);

const container = document.getElementById("details-container");

if (saree) {

      <div class="details-info">

        <p class="price">₹${saree.price} <span class="old-price">₹${saree.oldPrice}</span></p>
       <button class="btn" onclick="addToCart('${saree.name}', ${saree.price || 0}, '${saree.img || 'images/default.jpg'}')">Add to Cart</button>

     <button onclick="buyNow('${saree.name}', '${saree.type}', ${saree.price || 0}, '${saree.img || 'images/default.jpg'}')">Buy Now</button>

      </div>
    </div>

    <div class="other-sarees">

            <h4>${s.name}</h4>
            <p class="price">₹${s.price}</p>
          </div>
        `).join('')}
      </div>
    </div>
  `;
} else {
  container.innerHTML = "<h2 style='color:red;text-align:center;'>Saree not found!</h2>";
}

function addToCart(name, price, image) {
  price = Number(price) || 0;
  image = image || "images/default.jpg";

  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  let existing = cart.find(item => item.name === name);

  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ name, price, image, qty: 1 });
  }

  localStorage.setItem('cart', JSON.stringify(cart));
  alert(`${name} added to cart!`);
  window.location.href = "cart.html";
}

function buyNow(name, type, price, image) {
  const selectedItem = [{ 
    name, 
    type, 
    price: Number(price) || 0, 
    image: image || "images/default.jpg", 
    qty: 1 
  }];
  localStorage.setItem("cart", JSON.stringify(selectedItem));
  window.location.href = `process.html?type=${encodeURIComponent(type)}&name=${encodeURIComponent(name)}`;
}
