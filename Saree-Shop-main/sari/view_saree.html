  function buyNow(name, type) {
  // type आणि name URL मध्ये encode करून details.html वर पाठवतोय
  window.location.href = `details.html?type=${encodeURIComponent(type)}&name=${encodeURIComponent(name)}`;
}


  // Convert nested to single array
   function randomPrice() {
    const price = Math.floor(Math.random() * (6000 - 1500) + 1500);
    const oldPrice = price + Math.floor(Math.random() * 2000 + 500);
    return { price: price, oldPrice: oldPrice };
  }

  // सगळे sarees एकत्र array मध्ये (color/type सोपं करण्यासाठी)
  let allSarees = [];
  for (const [type, items] of Object.entries(sareeData)) {
    allSarees = allSarees.concat(items.map(s => {
      const prices = randomPrice();
      // Random color assign (तू हवं तर real color property देऊ शकतोस)
      const colors = ["Red", "Blue", "Green", "Yellow", "Pink", "Purple", "Orange"];

      const color = colors[Math.floor(Math.random() * colors.length)];
      return { ...s, type: type, color: color, price: prices.price, oldPrice: prices.oldPrice };
    }));
  }

  const container = document.getElementById("saree-container");
  const sareeTitle = document.getElementById("saree-title");

  // URL मधून type घेणे (उदा. view_saree.html?type=silk)
  const urlParams = new URLSearchParams(window.location.search);
  const sareeType = urlParams.get("type") || "paithani";

  // Page title अपडेट
  sareeTitle.innerText = sareeType.charAt(0).toUpperCase() + sareeType.slice(1) + " Sarees";

  // त्या type चे sarees
  let selectedSarees = allSarees.filter(s => s.type === sareeType);

function renderSarees(data) {
  container.innerHTML = "";
  if (!data.length) {
    container.innerHTML = "<p>No sarees found.</p>";
    return;
  }
  data.forEach(s => {
    container.innerHTML += `
      <div class="saree-card">
        <img src="${s.img}" alt="${s.name}">
        <p><strong>${s.name}</strong></p>
        <p class="price">₹${s.price} <span class="old-price">₹${s.oldPrice}</span></p>
        <button class="btn" onclick="addToCart('${s.name}', ${s.price}, '${s.img}')">Add to Cart</button>
        <button class="btn" onclick="buyNow('${s.name}','${s.type}')">Buy Now</button>
      </div>
    `;
  });
}

  renderSarees(selectedSarees);

  document.querySelectorAll(".color-filter, .price-filter, .type-filter").forEach(cb => {
    cb.addEventListener("change", applyFilters);
  });

  function applyFilters() {
    const colors = [...document.querySelectorAll(".color-filter:checked")].map(cb => cb.value);
    const prices = [...document.querySelectorAll(".price-filter:checked")].map(cb => cb.value);
    const types = [...document.querySelectorAll(".type-filter:checked")].map(cb => cb.value);

    let filtered = selectedSarees.filter(s => {
      const colorMatch = colors.length ? colors.includes(s.color) : true;
      const typeMatch = types.length ? types.includes(s.type) : true;
      const priceMatch = prices.length ? prices.some(r => {
        const [min, max] = r.split("-").map(Number);
        return s.price >= min && (max ? s.price <= max : true);
      }) : true;
      return colorMatch && typeMatch && priceMatch;
    });
    renderSarees(filtered);
  }

function addToCart(name, price, image) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    // Check if item already exists
    let existing = cart.find(item => item.name === name);
    if (existing) {
        existing.qty += 1;
    } else {
        cart.push({ name: name, price: price, image: image, qty: 1 });
    }
    localStorage.setItem('cart', JSON.stringify(cart));
    alert("Added to cart!");
    window.location.href = "cart.html"; // Direct cart ला जाण्यासाठी
}
